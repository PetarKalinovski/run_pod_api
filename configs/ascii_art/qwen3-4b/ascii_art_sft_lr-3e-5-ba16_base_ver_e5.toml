# Full SFT of Qwen3-4B on ASCII art (human-crafted, 5.3k samples)
# Usage: runpodx run examples/ascii_art_sft.toml
#        runpodx run examples/ascii_art_sft.toml --dry-run

[run]
method = "sft"
terminate_after_hub_push = true

[pod]
name = "qwen3-ascii-art-sft"
image = "runpod/pytorch:2.1.0-py3.10-cuda11.8.0-devel-ubuntu22.04"
cloud_type = "SECURE"
container_disk_gb = 80
volume_gb = 130

[pod.gpu]
type_ids = ["NVIDIA RTX A6000"]
count = 1

[model]
name = "Qwen/Qwen3-4B-Base"
adapter = "full"
resume_from_checkpoint = "latest"


[dataset]
source = "huggingface"
path = "AvaLovelace/ASCII-Art"
split = "train"
format = "sharegpt"
validation_ratio = 0.1
validation_seed = 42

[training]
epochs = 5
lr = 3e-5
batch_size = 2
gradient_accumulation = 16
max_seq_length = 4096
warmup_ratio = 0.05
weight_decay = 0.01
bf16 = true
optimizer = "adamw_8bit"
logging_steps = 5
save_steps = 100
save_total_limit = 3
append_eos_token = true
sanitize_ascii_outputs = true
ascii_max_tail_line_repeats = 8
generation_eval_enabled = true
generation_eval_max_new_tokens = 384
convert_to_prompt_completion = true

[output]
save_path = "/workspace/output"
push_to_hub = true
hub_model_id = "PetarKal/Qwen3-4B-ascii-art-e5-lr3e-5-ga16-base"

[monitoring]
wandb_project = "qwen3-ascii-art"
wandb_run_name = "qwen3-4B-base-e5-lr3e-5-ga16-val"
log_interval = 5
wandb_entity = "petar-kalinovski-"
