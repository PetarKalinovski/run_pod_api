[project]
name = "runpodx"
version = "0.1.0"
description = "Config-driven Python client for RunPod's REST API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.10",
    "tenacity>=9.0",
    "typer>=0.15",
    "rich>=13.0",
    "python-dotenv>=1.2.1",
]

[project.scripts]
runpodx = "runpodx.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/runpodx"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.35",
    "ruff>=0.9",
]
